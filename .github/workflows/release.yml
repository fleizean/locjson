name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false # no cache in release jobs
      - name: Tag matches _version.py
        run: test "v$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/locjson/_version.py)" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      - run: uvx check-wheel-contents@0.6.3 dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish-testpypi
    needs: build
    runs-on: ubuntu-latest
    environment: { name: testpypi, url: "https://test.pypi.org/p/locjson" }
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: "https://test.pypi.org/legacy/"
          skip-existing: true

  publish-pypi:
    name: publish-pypi
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/p/locjson" }
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
