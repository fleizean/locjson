name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONWARNDEFAULTENCODING: "1"
  PYTHONUTF8: "0"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      # project (editable) + default group "dev" + the babel extra, so mypy and
      # lint-imports see Babel
      - run: uv sync --extra babel
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync lint-imports

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync coverage run -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-free-threaded:
    name: test (ubuntu-latest, 3.14t, free-threaded)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14t"
          enable-cache: true
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync python -m pytest

  # The matrix above stays extras-free (the zero-dependency path); this job
  # runs the whole suite with the babel extra, and its coverage joins the
  # combined report.
  test-babel:
    name: test (ubuntu-latest, 3.14, babel)
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.ubuntu-latest-3.14-babel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --extra babel # project + default group "dev" + babel
      - run: uv run --no-sync coverage run -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-ubuntu-latest-3.14-babel
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage
    needs: [test, test-babel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --no-default-groups --group test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: uv run --no-sync coverage combine
      - run: uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - run: uv run --no-sync coverage report # enforces fail_under = 90

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      - run: uvx check-wheel-contents@0.6.3 dist/*.whl
      - name: Clean-venv wheel smoke test
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/locjson/_version.py)"
          test "$(uv pip list --python "$RUNNER_TEMP/smoke" --format json)" = '[{"name":"locjson","version":"'"$version"'"}]'
          "$RUNNER_TEMP/smoke/bin/python" -I -c "import importlib.resources as r, locjson; assert r.files('locjson').joinpath('py.typed').is_file(); print(locjson.__version__)"
